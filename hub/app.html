<div class="portal-shell">
  <header class="topbar">
    <div class="topbar-brand"><span class="topbar-logo">R</span><strong>Retail inMotion</strong><span>Service Hub</span></div>
    <nav class="topnav hub-nav" aria-label="Service Hub">
      <a class="nav-item" href="#live" data-view="live">Live</a>
      <a class="nav-item" href="#reports" data-view="reports">Reports</a>
    </nav>
    <div class="topbar-tools">
      <a id="hub-portal" class="close-expanded hub-link" href="#" hidden>Raise or reply in the portal</a>
      <form method="post" action="/signout"><button class="close-expanded" type="submit">Sign out</button></form>
    </div>
  </header>
  <main class="portal-page">
    <section class="hub-intro">
      <h1 id="hub-heading">Service dashboard</h1>
      <p id="hub-subtitle"></p>
    </section>
    <section id="live-dashboard" class="section live-dash" aria-live="polite"><div class="message">Loading your live dashboard…</div></section>
    <section id="reports" class="section live-dash" hidden>
      <form id="report-range" class="hub-range">
        <label>Period
          <select id="report-preset">
            <option value="7d">Last 7 days</option>
            <option value="30d" selected>Last 30 days</option>
            <option value="90d">Last 90 days</option>
            <option value="this-month">This month</option>
            <option value="last-month">Last month</option>
            <option value="12m">Last 12 months</option>
            <option value="custom">Custom…</option>
          </select>
        </label>
        <label class="hub-custom" hidden>From <input type="date" id="report-from"></label>
        <label class="hub-custom" hidden>To <input type="date" id="report-to"></label>
        <button class="primary-button" type="submit">Show report</button>
        <button class="page-button hub-print" type="button">Print / PDF</button>
      </form>
      <div id="report-body" aria-live="polite"></div>
    </section>
  </main>
</div>
<script src="/assets/hub.js"></script>
