name: Brand check

# Retail inMotion edition: fails if the Marketplace brand appears anywhere in the repository.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  brand:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: No Marketplace branding
        run: |
          # src/portal-plus-contract.js holds Portal+ protocol identifiers that must
          # match the Portal+ adapter on the work site; they are not branding.
          if git grep -n -i -I 'n[u]vriqo' -- . ':!src/portal-plus-contract.js'; then
            echo "::error::Marketplace branding found (see above). This repository is the Retail inMotion edition."
            exit 1
          fi
