name: Remote Forge QA

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy and upgrade the development installation
        required: true
        type: boolean
        default: false
      site:
        description: Atlassian site
        required: true
        default: retailinmotion-sandbox1.atlassian.net
      environment:
        description: Forge environment
        required: true
        default: development
      product:
        description: Atlassian product
        required: true
        default: jira

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if npm ci; then
            echo "Installed from lockfile"
          else
            echo "Lockfile install failed (commonly stale Forge prerelease URL); regenerating dependencies from package.json"
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Build
        run: npm run build
      - name: Run tests
        run: npm test
      - name: Forge lint
        shell: bash
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
          npm install --global @forge/cli
          forge settings set usage-analytics false
          forge settings set default-environment development
          # Approval notices (e.g. a major version because the hub web trigger ends
          # "Runs on Atlassian" eligibility) are not errors; fail on anything else.
          set +e
          forge lint 2>&1 | tee forge-lint.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ] && grep -q "(0 errors, 0 warnings" forge-lint.log; then echo "Only approval notices; continuing."; exit 0; fi
          exit "$status"

  deploy-development:
    needs: validate
    if: (github.event_name == 'workflow_dispatch' && inputs.deploy == true) || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    env:
      FORGE_EMAIL: ${{ secrets.FORGE_EMAIL }}
      FORGE_API_TOKEN: ${{ secrets.FORGE_API_TOKEN }}
      DEPLOY_SITE: ${{ inputs.site || 'retailinmotion-sandbox1.atlassian.net' }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment || 'development' }}
      DEPLOY_PRODUCT: ${{ inputs.product || 'jira' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if ! npm ci; then
            rm -rf node_modules package-lock.json
            npm install --no-audit --no-fund
          fi
      - name: Build
        run: npm run build
      - name: Check Forge credentials
        run: |
          test -n "$FORGE_EMAIL" || (echo "Missing FORGE_EMAIL" && exit 1)
          test -n "$FORGE_API_TOKEN" || (echo "Missing FORGE_API_TOKEN" && exit 1)
      - run: npm install --global @forge/cli
      # Service Hub proof of concept: development only. The secret comes from the
      # HUB_SECRET repository secret and is stored encrypted in Forge.
      - name: Service Hub variables (development only)
        if: env.DEPLOY_ENVIRONMENT == 'development'
        env:
          HUB_SECRET: ${{ secrets.HUB_SECRET }}
          HUB_URL: ${{ vars.HUB_URL }}
        run: |
          if [ -z "$HUB_SECRET" ] || [ -z "$HUB_URL" ]; then echo "Service Hub not configured; skipping"; exit 0; fi
          forge settings set usage-analytics false
          forge variables set --environment "$DEPLOY_ENVIRONMENT" --encrypt HUB_SECRET "$HUB_SECRET"
          forge variables set --environment "$DEPLOY_ENVIRONMENT" HUB_URL "$HUB_URL"
      - name: Deploy
        run: |
          forge settings set usage-analytics false
          forge settings set default-environment "$DEPLOY_ENVIRONMENT"
          forge deploy --environment "$DEPLOY_ENVIRONMENT" --non-interactive
      - name: Install or upgrade installation
        shell: bash
        run: |
          set +e
          forge install --upgrade --site "$DEPLOY_SITE" --product "$DEPLOY_PRODUCT" --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive 2>&1 | tee forge-install.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then exit 0; fi
          if grep -q "Could not find an installation" forge-install.log; then
            echo "No installation yet on $DEPLOY_SITE; installing for the first time."
            forge install --site "$DEPLOY_SITE" --product "$DEPLOY_PRODUCT" --environment "$DEPLOY_ENVIRONMENT" --confirm-scopes --non-interactive
            exit 0
          fi
          exit "$status"
      - name: Verify TEST project
        env:
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
        shell: bash
        run: |
          if [ -z "$JIRA_EMAIL" ] || [ -z "$JIRA_API_TOKEN" ]; then echo "Jira credentials not configured; skipping REST smoke check"; exit 0; fi
          code=$(curl -sS -o /tmp/project.json -w "%{http_code}" -u "$JIRA_EMAIL:$JIRA_API_TOKEN" "https://$DEPLOY_SITE/rest/api/3/project/TEST")
          test "$code" = "200" || (cat /tmp/project.json && exit 1)
          echo "TEST project reachable"
